<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Expense Tracker</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gradient-to-br from-blue-100 to-purple-200 min-h-screen flex items-center justify-center">

<div class="bg-white w-[420px] p-6 rounded-2xl shadow-xl">

<h1 class="text-3xl font-bold text-center text-gray-800 mb-5">
 Expense Tracker
</h1>

<div class="space-y-3">

<input id="description" type="text" placeholder="Expense description"
class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 outline-none">

<input id="amount" type="number" placeholder="Amount (Ksh)"
class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 outline-none">

<input id="category" type="text" placeholder="Category (Food, Transport...)"
class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-400 outline-none">

<button id="addBtn"
class="w-full bg-blue-500 text-white p-3 rounded-lg font-semibold hover:bg-blue-600 active:scale-95 transition">
 Add Expense
</button>

</div>

<div class="mt-4">

<select id="category"
class="w-full border rounded-lg p-2">
<option value="all">food</option>
<option value="all">shopping</option>
<option value="all">transport</option>
<option value="all">others</option>

</select>
</div>

<ul id="expenseList" class="mt-5 space-y-3 max-h-60 overflow-y-auto"></ul>

<div class="mt-5 p-3 bg-blue-50 rounded-lg text-center">

<h3 class="text-lg font-bold text-gray-700">
Total Spent: <span class="text-blue-600">Ksh <span id="total">0</span></span>
</h3>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
